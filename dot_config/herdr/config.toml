onboarding = false
[keys]
prefix = "ctrl+space"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""


split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
zoom = "prefix+z"

new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"

resize_mode = "prefix+r"
detach = "prefix+q"
reload_config = "prefix+shift+r"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "dev-shimada.auto-tab-name.sync"
description = "sync tab names"

[ui.toast]
delivery = "system"

[ui]
prompt_new_tab_name = false

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

[terminal]
new_cwd = "home"
